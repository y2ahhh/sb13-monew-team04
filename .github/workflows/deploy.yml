name: deploy-prod

# main으로 merge된 시점 = AGENTS.md 기준 "운영 반영"이므로, main push만 트리거로 둔다.
# develop push나 PR에서는 절대 배포되지 않는다. (develop-build-test.yml이 그쪽 검증을 담당)
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write   # GHCR(GitHub Container Registry)에 이미지를 push하기 위해 필요

# 같은 이름의 배포가 동시에 두 개 뛰지 않도록 한다.
# cancel-in-progress: false → 이미 서버에 배포 중인 작업을 도중에 끊지 않고, 새 배포는 줄을 서서 기다린다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build-and-push-image
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN은 Actions가 매 실행마다 자동 발급하는 단기 토큰이다. 별도로 만들 필요가 없다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "image_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # commit sha 태그는 "이 배포가 정확히 어떤 커밋인지" 추적하기 위한 것이고,
          # latest 태그는 배포 스크립트가 매번 새로 pull할 대상을 가리키기 위한 것이다.
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_latest }}
          # GitHub Actions의 캐시를 재사용해서, 매번 처음부터 gradle 의존성을 받지 않게 한다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy-to-ec2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 아래 script는 EC2 서버 안에서 그대로 실행된다.
          # /opt/monew에는 미리 compose.prod.yaml과 .env.prod가 준비되어 있어야 한다. (배포 가이드 참고)
          script: |
            set -e
            cd /opt/monew

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # latest 태그로 새 이미지만 받아온다. (postgres 이미지는 이미 로컬에 있으므로 다시 받지 않음)
            docker compose -f compose.prod.yaml --env-file .env.prod pull app

            # 이미지가 바뀐 서비스만 재생성해서 컨테이너를 교체한다. DB 컨테이너는 그대로 유지된다.
            docker compose -f compose.prod.yaml --env-file .env.prod up -d --no-deps app

            # 더 이상 어떤 컨테이너도 참조하지 않는 이전 이미지(dangling image)를 정리해 디스크를 아낀다.
            docker image prune -f
